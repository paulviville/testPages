<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AR Rotating Cube</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #f4f4f1; --fg: #1d1d1b; --accent: #3b6df0; --accent-fg: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16171a; --fg: #ececea; --accent: #6b93ff; --accent-fg: #0d0e10; }
  }
  :root[data-theme="dark"] { --bg: #16171a; --fg: #ececea; --accent: #6b93ff; --accent-fg: #0d0e10; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  button { font: inherit; font-weight: 600; padding: 14px 28px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg); }
  button[disabled] { opacity: .5; }
  #msg { margin: 10px 0 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<div id="ui">
  <button id="arBtn" disabled>Checking AR support…</button>
  <p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('arBtn');
  var msg = document.getElementById('msg');

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 20);
  camera.position.set(0, 0.15, 0.5);   // only used in the non-AR preview

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.prepend(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.0));
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(1, 2, 1);
  scene.add(sun);

  // 10 cm cube, floating 0.5 m in front of where the AR session starts
  var cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.1, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3b6df0, roughness: 0.4, metalness: 0.1 })
  );
  cube.position.set(0, 0, -0.5);
  scene.add(cube);

  var clock = new THREE.Clock();
  renderer.setAnimationLoop(function () {
    var dt = clock.getDelta();
    cube.rotation.x += dt * 0.8;
    cube.rotation.y += dt * 1.2;
    if (!renderer.xr.isPresenting) camera.lookAt(cube.position);
    renderer.render(scene, camera);
  });

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---- WebXR session handling ----
  var session = null;

  function onEnd() {
    session = null;
    btn.textContent = 'Start AR';
  }

  async function toggleAR() {
    if (session) { session.end(); return; }
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['local-floor']
      });
      session.addEventListener('end', onEnd);
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      btn.textContent = 'Exit AR';
    } catch (e) {
      session = null;
      msg.textContent = 'Could not start AR: ' + e.message;
    }
  }

  async function init() {
    if (!('xr' in navigator)) {
      btn.textContent = 'AR not supported';
      msg.textContent = 'WebXR isn’t available here. Showing a normal 3D preview. Try Chrome on an ARCore-capable Android phone.';
      return;
    }
    try {
      var ok = await navigator.xr.isSessionSupported('immersive-ar');
      if (ok) {
        btn.disabled = false;
        btn.textContent = 'Start AR';
        btn.addEventListener('click', toggleAR);
      } else {
        btn.textContent = 'AR not supported';
        msg.textContent = 'This device or browser doesn’t support immersive AR. Showing a normal 3D preview.';
      }
    } catch (e) {
      btn.textContent = 'AR not supported';
      msg.textContent = 'AR check failed: ' + e.message;
    }
  }
  init();
})();
</script>
</body>
</html>
